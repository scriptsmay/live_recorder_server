services:
  live_recorder_server:
    # 镜像发布在github站
    image: ghcr.io/scriptsmay/live_recorder_server:latest
    container_name: live_recorder_server
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@postgres:5432/live_recorder}
      REDIS_URL: ${REDIS_URL:-redis://default:password@redis:6379/1}
      MESSAGE_FEISHU_WEBHOOK: ${MESSAGE_FEISHU_WEBHOOK:-}
      MESSAGE_GOTIFY_SERVER: ${MESSAGE_GOTIFY_SERVER:-}
      MESSAGE_GOTIFY_TOKEN: ${MESSAGE_GOTIFY_TOKEN:-}
      MESSAGE_GOTIFY_PRIORITY: ${MESSAGE_GOTIFY_PRIORITY:-5}
      REPLAY_WORK_DIR: ${REPLAY_WORK_DIR:-/data/replay}
    ports:
      - '11123:1123'
    volumes:
      - ./data/video_downloads:/data/video_downloads
      - ./data/danmaku_output:/data/danmaku_output
      - ./data/biliup:/data/biliup
      - ./data/replay:/data/replay
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + (process.env.PORT || 1123) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  replay_cron:
    image: alpine:3.20
    container_name: replay_cron
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      API_BASE: http://live_recorder_server:1123
      REPLAY_CRON_EXPR: ${REPLAY_CRON_EXPR:-0 3 * * *}
      REPLAY_CRON_ENABLED: ${REPLAY_CRON_ENABLED:-false}
      REPLAY_PRINCIPAL_ID: ${REPLAY_PRINCIPAL_ID:-}
      REPLAY_CRON_COUNT: ${REPLAY_CRON_COUNT:-1}
    volumes:
      - ./scripts/replay-cron.sh:/replay-cron.sh:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ "$$REPLAY_CRON_ENABLED" != "true" ]; then
          echo "[replay-cron] 已禁用，退出"
          exit 0
        fi
        echo "[replay-cron] 启用，表达式: $$REPLAY_CRON_EXPR"
        echo "$$REPLAY_CRON_EXPR /replay-cron.sh >> /proc/1/fd/1 2>&1" | crontab -
        crond -f -l 2
    restart: unless-stopped
    depends_on:
      - live_recorder_server
