<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - 页面未找到 - K-Recorder</title>
    <style>
      /* 定义主题色变量 */
      :root {
        --bg-gradient-start: #667eea;
        --bg-gradient-end: #764ba2;
        --text-color: #ffffff;

        /* 主按钮 */
        --btn-primary-bg: #ffffff;
        --btn-primary-text: #667eea;

        /* 次要按钮 */
        --btn-secondary-bg: rgba(255, 255, 255, 0.2);
        --btn-secondary-bg-hover: rgba(255, 255, 255, 0.3);
        --btn-secondary-text: #ffffff;

        /* 阴影与特效 */
        --shadow-color: rgba(0, 0, 0, 0.2);
        --shadow-color-hover: rgba(0, 0, 0, 0.3);
      }
      /* 橙色主题：激活时覆盖变量 */
      [data-theme='orange'] {
        --bg-gradient-start: #ff7e5f;
        --bg-gradient-end: #feb47b;

        --btn-primary-text: #ff7e5f;

        --shadow-color: rgba(182, 63, 30, 0.25);
        --shadow-color-hover: rgba(182, 63, 30, 0.4);
      }

      /* 如果以后想支持系统暗黑模式，只需在这里覆盖变量即可 */
      @media (prefers-color-scheme: dark) {
        :root {
          /* 示例：这里可以换成暗黑系的主题色 */
          /* --bg-gradient-start: #1a1c23; */
          /* --bg-gradient-end: #252836; */
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          'Noto Sans SC',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        /* 使用变量拼接渐变背景 */
        background: linear-gradient(
          135deg,
          var(--bg-gradient-start) 0%,
          var(--bg-gradient-end) 100%
        );
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-color);
      }

      .container {
        text-align: center;
        padding: 40px;
        max-width: 600px;
      }

      .error-code {
        font-size: 120px;
        font-weight: 900;
        line-height: 1;
        margin-bottom: 20px;
        text-shadow: 0 4px 20px var(--shadow-color-hover);
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      .error-title {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 16px;
        text-shadow: 0 2px 10px var(--shadow-color);
      }

      .error-message {
        font-size: 18px;
        line-height: 1.6;
        margin-bottom: 40px;
        opacity: 0.9;
      }

      .btn-group {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 32px;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 12px;
        transition: all 0.3s ease;
        cursor: pointer;
        border: none;
        font-family: inherit;
      }

      .btn-primary {
        background: var(--btn-primary-bg);
        color: var(--btn-primary-text);
        box-shadow: 0 4px 15px var(--shadow-color);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px var(--shadow-color-hover);
      }

      .btn-secondary {
        background: var(--btn-secondary-bg);
        color: var(--btn-secondary-text);
        backdrop-filter: blur(10px);
      }

      .btn-secondary:hover {
        background: var(--btn-secondary-bg-hover);
        transform: translateY(-2px);
      }

      .icon {
        width: 20px;
        height: 20px;
      }

      @media (max-width: 600px) {
        .error-code {
          font-size: 80px;
        }

        .error-title {
          font-size: 24px;
        }

        .error-message {
          font-size: 16px;
        }

        .btn-group {
          flex-direction: column;
        }

        .btn {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body data-theme="orange">
    <div class="container">
      <div class="error-code">404</div>
      <h1 class="error-title">页面未找到</h1>
      <p class="error-message">
        抱歉，您访问的页面不存在或已被移除。<br />
        请检查 URL 是否正确，或返回首页继续浏览。
      </p>
      <div class="btn-group">
        <a href="/" class="btn btn-primary">
          <svg
            class="icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
            ></path>
          </svg>
          返回首页
        </a>
        <button class="btn btn-secondary" onclick="window.history.back()">
          <svg
            class="icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            ></path>
          </svg>
          返回上一页
        </button>
      </div>
    </div>

    <script>
      console.error(
        '404 Error: User attempted to access non-existent route:',
        window.location.pathname,
      );
    </script>
  </body>
</html>
