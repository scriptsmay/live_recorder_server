name: Build FFmpeg Image

on:
  schedule:
    # 每周一凌晨 3 点自动构建，确保镜像常驻 GHCR
    - cron: '0 3 * * 1'
  # 允许在 GitHub Actions 页面手动点击运行
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg 版本标签 (如 master-7.1, master-7.2)'
        required: false
        default: 'master-7.1'
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FFMPEG_VERSION: ${{ inputs.ffmpeg_version || 'master-7.1' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Log in to GHCR 登录镜像库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.MY_TOKEN }}

      - name: 2. Pull upstream FFmpeg image 拉取上游 FFmpeg 镜像
        run: |
          echo "拉取上游 FFmpeg 镜像: ${{ env.FFMPEG_VERSION }}"
          docker pull ghcr.io/ffpresets/ffmpeg-builds/${{ env.FFMPEG_VERSION }}:latest

      - name: 3. Verify FFmpeg version 验证版本
        run: |
          echo "FFmpeg 版本信息:"
          docker run --rm ghcr.io/ffpresets/ffmpeg-builds/${{ env.FFMPEG_VERSION }}:latest \
            ffmpeg -version | head -3

      - name: 4. Tag and push to own registry 打标签并推送到自有仓库
        run: |
          TARGET_IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/ffmpeg"
          TARGET_TAG="${{ env.FFMPEG_VERSION }}"

          echo "目标镜像: ${TARGET_IMAGE}:${TARGET_TAG}"
          docker tag \
            ghcr.io/ffpresets/ffmpeg-builds/${{ env.FFMPEG_VERSION }}:latest \
            ${TARGET_IMAGE}:${TARGET_TAG}
          docker push ${TARGET_IMAGE}:${TARGET_TAG}

          echo "推送完成: ${TARGET_IMAGE}:${TARGET_TAG}"
