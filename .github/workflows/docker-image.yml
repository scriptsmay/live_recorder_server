name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  # 允许在 GitHub Actions 页面手动点击运行
  workflow_dispatch:

# 赋予内置 Token 权限（双重保险）
permissions:
  contents: read
  packages: write

env:
  # 默认推送到 GitHub 自带的容器镜像库 (GHCR)
  REGISTRY: ghcr.io
  # 镜像名称，自动读取 "你的GitHub用户名/仓库名"
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository 检出代码
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx 配置高阶构建环境
        uses: docker/setup-buildx-action@v3

      - name: 3. Log in to the Container registry 登录镜像库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.MY_TOKEN }}

      - name: 4. Extract metadata 自动生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 1. 如果是打 tag 触发(如 v1.0)，直接把 v1.0 作为镜像 tag
            type=ref,event=tag
            # 2. 如果是当前触发条件，强行打上 latest 标签
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: 5. Build and push Docker image 构建并推送
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 🚀 神奇魔法：开启 GitHub Actions 原生缓存机制，后续构建速度直接起飞
          cache-from: type=gha
          cache-to: type=gha,mode=max
