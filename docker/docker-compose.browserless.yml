# Optional overlay for docker-compose.full.yml.
# Usage: cd docker && docker compose --env-file ../.env -f docker-compose.full.yml -f docker-compose.browserless.yml up -d --build
services:
  app:
    environment:
      REMOTE_BROWSER_WS_ENDPOINT: ws://browserless:3000/chromium?token=${BROWSERLESS_TOKEN:-change-me-browserless-token}
      KUAISHOU_CHECKER_ENABLED: ${KUAISHOU_CHECKER_ENABLED:-true}
      POLLING_KUAISHOU_COOKIE: ${POLLING_KUAISHOU_COOKIE:-}
    depends_on:
      browserless:
        condition: service_started

  browserless:
    image: ghcr.io/browserless/chromium:latest
    shm_size: 2gb
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      TOKEN: ${BROWSERLESS_TOKEN:-change-me-browserless-token}
      CONCURRENT: ${BROWSERLESS_CONCURRENT:-1}
      QUEUED: ${BROWSERLESS_QUEUED:-5}
      TIMEOUT: ${BROWSERLESS_TIMEOUT_MS:-60000}
      # 反爬：浏览器层面全局启用 stealth + 禁用自动化标记
      DEFAULT_STEALTH: 'true'
      DEFAULT_LAUNCH_ARGS: '["--disable-blink-features=AutomationControlled"]'
      # 预启动 1 个 Chromium 实例，降低首次连接延迟
      PREBOOT_CHROME: 'true'
      PREBOOT_QUANTITY: '1'
    restart: unless-stopped
