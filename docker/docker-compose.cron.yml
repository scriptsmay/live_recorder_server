# 回放定时任务 + 数据同步 cron overlay
# 始终叠加在 base docker-compose.yml 之上（依赖服务名 live_recorder_server）：
#   生产: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.cron.yml up -d
#   本地: docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.cron.yml up -d
#
# replay_cron 镜像（Dockerfile.replay-cron）是轻量 Alpine，**不含 scripts**，
# 完全依赖 SCRIPTS_VOLUME 挂载。生产用 shared_scripts named volume，
# 由主容器 entrypoint 从镜像内 /app/scripts.image 刷新（v1.8.2）。
services:
  replay_cron:
    image: ${REPLAY_CRON_IMAGE:-registry.cnb.cool/scriptsmay/live_recorder_server-replay-cron:latest}
    container_name: replay_cron
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      API_BASE: http://live_recorder_server:1123
      CRON_API_TOKEN: ${CRON_API_TOKEN:-}
      # 脚本目录（容器内路径，需与 volume 挂载一致）
      SCRIPTS_DIR: ${SCRIPTS_DIR:-/mnt/scripts}
      # Redis 事件监听
      REDIS_URL: ${REDIS_URL:-}
      REDIS_PUBLISH_CHANNEL: ${REDIS_PUBLISH_CHANNEL:-task:completed}
      # 回放定时任务
      REPLAY_CRON_EXPR: ${REPLAY_CRON_EXPR:-0 3 * * *}
      REPLAY_CRON_ENABLED: ${REPLAY_CRON_ENABLED:-false}
      REPLAY_PRINCIPAL_ID: ${REPLAY_PRINCIPAL_ID:-}
      REPLAY_CRON_COUNT: ${REPLAY_CRON_COUNT:-1}
      # 数据同步
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@postgres:5432/live_recorder}
      SUPABASE_URL: ${SUPABASE_URL:-}
      REMOTE_TABLE: ${REMOTE_TABLE:-test_records}
      SYNC_CRON_EXPR: ${SYNC_CRON_EXPR:-0 4 * * *}
      SYNC_CRON_ENABLED: ${SYNC_CRON_ENABLED:-false}
    volumes:
      # 生产环境：named volume 或 bind mount 到含脚本的目录
      # 默认挂载仓库 scripts/ 目录到 /mnt/scripts
      - ${SCRIPTS_VOLUME:-../scripts}:/mnt/scripts:ro
      # 宿主机时区（保证 cron 按本地时间触发）
      - /etc/localtime:/etc/localtime:ro
    entrypoint: /bin/sh
    command: ${CRON_ENTRYPOINT:-/mnt/scripts/cron-entrypoint.sh}
    stop_grace_period: 10s
    restart: unless-stopped
    depends_on:
      - live_recorder_server
