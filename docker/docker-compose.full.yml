services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.local
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-1123}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@postgres:5432/live_recorder}
      REDIS_URL: ${REDIS_URL:-redis://default:password@redis:6379/1}
      APP_DATA_DIR: ${APP_DATA_DIR:-/data}
      VIDEO_DOWNLOAD_DIR: ${VIDEO_DOWNLOAD_DIR:-/data/video_downloads}
      REPLAY_WORK_DIR: ${REPLAY_WORK_DIR:-/data/replay}
      YTDLP_TEMP_DIR: ${YTDLP_TEMP_DIR:-/tmp/yt_dlp_cache}
      BILIUP_WORK_DIR: ${BILIUP_WORK_DIR:-/data/biliup}
      BILIUP_PATH: ${BILIUP_PATH:-}
      MESSAGE_FEISHU_WEBHOOK: ${MESSAGE_FEISHU_WEBHOOK:-}
      MESSAGE_GOTIFY_SERVER: ${MESSAGE_GOTIFY_SERVER:-}
      MESSAGE_GOTIFY_TOKEN: ${MESSAGE_GOTIFY_TOKEN:-}
      MESSAGE_GOTIFY_PRIORITY: ${MESSAGE_GOTIFY_PRIORITY:-5}
      CRON_API_TOKEN: ${CRON_API_TOKEN:-}
      NAS_HOST: ${NAS_HOST:-}
      NAS_USER: ${NAS_USER:-}
      NAS_BACKUP_DIR: ${NAS_BACKUP_DIR:-}
    ports:
      - '${PORT:-1123}:1123'
    volumes:
      - ../data/video_downloads:/data/video_downloads
      - ../data/replay:/data/replay
      - ${YTDLP_TEMP_HOST_DIR:-../data/yt_dlp_cache}:/tmp/yt_dlp_cache
      - ../data/biliup:/data/biliup
      - ../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + (process.env.PORT || 1123) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-live_recorder}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:-password}']
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD:-password}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
