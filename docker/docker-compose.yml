# Base compose — 主服务共性定义
# 不同场景通过 override 文件叠加差异：
#   本地全栈开发: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#   本地 + browserless: docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.browserless.yml up -d --build
#   生产: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.cron.yml up -d
services:
  live_recorder_server:
    image: ${APP_IMAGE:-registry.cnb.cool/scriptsmay/live_recorder_server:latest}
    container_name: live_recorder_server
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-1123}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@postgres:5432/live_recorder}
      REDIS_URL: ${REDIS_URL:-redis://default:password@redis:6379/1}
      REDIS_PUBLISH_CHANNEL: ${REDIS_PUBLISH_CHANNEL:-task:completed}
      APP_DATA_DIR: ${APP_DATA_DIR:-/data}
      VIDEO_DOWNLOAD_DIR: ${VIDEO_DOWNLOAD_DIR:-/data/video_downloads}
      REPLAY_WORK_DIR: ${REPLAY_WORK_DIR:-/data/replay}
      YTDLP_TEMP_DIR: ${YTDLP_TEMP_DIR:-/tmp/yt_dlp_cache}
      BILIUP_WORK_DIR: ${BILIUP_WORK_DIR:-/data/biliup}
      BILIUP_PATH: ${BILIUP_PATH:-}
      MESSAGE_FEISHU_WEBHOOK: ${MESSAGE_FEISHU_WEBHOOK:-}
      MESSAGE_GOTIFY_SERVER: ${MESSAGE_GOTIFY_SERVER:-}
      MESSAGE_GOTIFY_TOKEN: ${MESSAGE_GOTIFY_TOKEN:-}
      MESSAGE_GOTIFY_PRIORITY: ${MESSAGE_GOTIFY_PRIORITY:-5}
      CRON_API_TOKEN: ${CRON_API_TOKEN:-}
      NAS_HOST: ${NAS_HOST:-}
      NAS_USER: ${NAS_USER:-}
      NAS_BACKUP_DIR: ${NAS_BACKUP_DIR:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-24}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-auth_token}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DANMAKU_NATIVE_PLATFORMS: ${DANMAKU_NATIVE_PLATFORMS:-}
      DOUYIN_TTWID: ${DOUYIN_TTWID:-}
      BILIBILI_DANMAKU_COOKIE: ${BILIBILI_DANMAKU_COOKIE:-}
    ports:
      - '${HOST_PORT:-11123}:1123'
    volumes:
      - ../data/video_downloads:/data/video_downloads
      - ../data/replay:/data/replay
      - ${YTDLP_TEMP_HOST_DIR:-../data/yt_dlp_cache}:/tmp/yt_dlp_cache
      - ../data/biliup:/data/biliup
      - ../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + (process.env.PORT || 1123) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
